name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Install package without dependency resolution
        run: python -m pip install -e . --no-deps --no-build-isolation
      - name: Lint
        run: ruff check .

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Install package without dependency resolution
        run: python -m pip install -e . --no-deps --no-build-isolation
      - name: Unit tests
        run: pytest -m "not integration and not e2e"

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Install package without dependency resolution
        run: python -m pip install -e . --no-deps --no-build-isolation
      - name: Deterministic product smoke tests
        run: pytest -m e2e

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ads_growth
          POSTGRES_PASSWORD: ads_growth
          POSTGRES_DB: ads_growth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ads_growth -d ads_growth"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://ads_growth:ads_growth@localhost:5432/ads_growth
      RUN_POSTGRES_INTEGRATION: "1"
      TEST_DATABASE_URL: postgresql+psycopg://ads_growth:ads_growth@localhost:5432/ads_growth
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Install package without dependency resolution
        run: python -m pip install -e . --no-deps --no-build-isolation
      - name: PostgreSQL integration tests
        run: pytest -m integration tests/integration

  release-readiness:
    runs-on: ubuntu-latest
    needs: [lint, unit, e2e-smoke, postgres-integration]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Install package without dependency resolution
        run: python -m pip install -e . --no-deps --no-build-isolation
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Verify CLI entry point
        run: ads-growth-agent --version
